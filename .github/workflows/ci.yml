name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # CPU-only torch first: keeps the install from pulling ~2.5GB of
      # CUDA wheels that the test suite never uses.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Advisory: 2024-era pinned deps have known advisories until the
      # dependency-upgrade pass. Non-blocking for now; flip to blocking
      # (remove continue-on-error) once a clean scan is achievable.
      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm exec -- tsc --noEmit

      - name: Lint
        run: npm run lint

      # Advisory for now, same as pip-audit above.
      - name: npm audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high || true
