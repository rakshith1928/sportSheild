name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # CPU-only torch first: keeps the install from pulling ~2.5GB of
      # CUDA wheels that the test suite never uses.
      - name: Install CPU-only torch
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Blocking: the dependency tree was re-pinned in 2026-08 and scans clean.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm exec -- tsc --noEmit

      - name: Lint
        run: npm run lint

      # Blocking: next@16.3.2+ resolves all known advisories.
      - name: npm audit
        run: npm audit --audit-level=high
